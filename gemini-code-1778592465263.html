<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-포켓몬 트레이너 매칭 Standard</title>
    <style>
        :root { --pk-red: #ff0000; --pk-blue: #3b4cca; --pk-yellow: #ffde00; --pk-gold: #d4af37; --pk-bg: #f0f2f5; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: var(--pk-bg); margin: 0; padding: 20px; }
        .container { background: white; padding: 2.5rem; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 1000px; margin: 0 auto; text-align: center; }
        
        .api-box { background: #fff1f1; border: 2px solid #ffcccc; padding: 15px; border-radius: 15px; margin-bottom: 25px; }
        .api-box input { padding: 8px; border: 1px solid #ddd; border-radius: 5px; width: 250px; }
        
        h1 { color: var(--pk-red); font-size: 2.5rem; margin-bottom: 10px; -webkit-text-stroke: 1px var(--pk-blue); }
        .desc { color: #666; margin-bottom: 30px; }

        .input-section { background: #f9f9f9; padding: 30px; border-radius: 20px; margin-bottom: 30px; display: flex; justify-content: center; align-items: flex-end; gap: 15px; flex-wrap: wrap; }
        .field { text-align: left; }
        .field label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--pk-blue); }
        .field input { padding: 12px; border: 2px solid #eee; border-radius: 12px; width: 220px; font-size: 1.1rem; }
        
        .btn-call { padding: 12px 35px; background: var(--pk-blue); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .btn-call:hover { background: #223388; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(59, 76, 202, 0.4); }

        .weather-result { background: linear-gradient(135deg, #6dd5ed, #2193b0); color: white; padding: 25px; border-radius: 20px; margin-bottom: 30px; display: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border: 1px solid #eee; border-radius: 25px; padding: 20px; transition: 0.4s; position: relative; border-bottom: 5px solid #eee; display: flex; flex-direction: column; align-items: center; min-height: 250px; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .card img { width: 100%; max-width: 160px; height: 160px; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); }
        .name { font-size: 1.1rem; font-weight: bold; margin-top: 15px; color: #333; }
        
        /* 에이스 전용 스타일 (일반 포켓몬 버전) */
        .ace-card { border: 4px solid var(--pk-gold); background: linear-gradient(to bottom, #fffef0, #fff); border-bottom: 6px solid var(--pk-gold); }
        .ace-tag { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--pk-gold); color: black; padding: 5px 25px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 10; white-space: nowrap; }
        .form-info { font-size: 0.8rem; color: #b8860b; font-weight: bold; margin-top: 8px; }

        #loading { display: none; padding: 50px; font-weight: bold; color: var(--pk-blue); font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="api-box">
        <label>🔑 API 키: </label>
        <input type="password" id="apiKey" placeholder="OpenWeatherMap API Key">
        <button onclick="saveKey()" style="cursor:pointer; padding: 8px;">저장</button>
    </div>

    <h1>K-포켓몬 트레이너 매칭</h1>
    <p class="desc">특수 진화 없이 정통 엔트리로 승부합니다!</p>

    <div class="input-section">
        <div class="field">
            <label>도시 입력 (한글)</label>
            <input type="text" id="cityName" placeholder="예: 서울, 부산, 강릉" value="서울">
        </div>
        <button class="btn-call" onclick="startMatching()">엔트리 소환</button>
    </div>

    <div id="loading">📡 포켓몬 센터 데이터 수신 중...</div>

    <div id="weatherInfo" class="weather-result">
        <h2 id="locName">서울</h2>
        <div class="weather-detail" id="weatherText"></div>
    </div>

    <div class="grid" id="pokeGrid"></div>
</div>

<script>
    window.onload = () => {
        const saved = localStorage.getItem('owm_key');
        if(saved) document.getElementById('apiKey').value = saved;
    };

    function saveKey() {
        localStorage.setItem('owm_key', document.getElementById('apiKey').value);
        alert("키가 저장되었습니다.");
    }

    // 포켓몬 풀 (일반 최종 진화형 중심)
    const pokemonPool = {
        Clear: [{n:'리자몽',id:6},{n:'윈디',id:59},{n:'번치코',id:257},{n:'나인테일',id:38},{n:'불카모스',id:637}],
        Rain: [{n:'거북왕',id:9},{n:'갸라도스',id:130},{n:'대짱이',id:260},{n:'누리레느',id:730},{n:'개굴닌자',id:658}],
        Clouds: [{n:'잠만보',id:143},{n:'루카리오',id:448},{n:'마기라스',id:248},{n:'액스라이즈',id:612},{n:'보만다',id:373}],
        Snow: [{n:'라프라스',id:131},{n:'맘모꾸리',id:473},{n:'글레이시아',id:471},{n:'눈설왕',id:460},{n:'씨카이저',id:365}],
        Etc: [{n:'팬텀',id:94},{n:'가디안',id:282},{n:'한카리아스',id:445},{n:'따라큐',id:778},{n:'메타그로스',id:376}]
    };

    // 에이스 풀 (일반 최종 진화형 또는 전설의 포켓몬)
    const acePool = [
        {n:'망나뇽', id:149}, {n:'뮤츠', id:150}, {n:'칠색조', id:250}, {n:'루기아', id:249},
        {n:'가이오가', id:382}, {n:'그란돈', id:383}, {n:'레쿠쟈', id:384}, {n:'디아루가', id:483},
        {n:'펄기아', id:484}, {n:'기라티나', id:487}, {n:'아르세우스', id:493}, {n:'제르네아스', id:716},
        {n:'이벨타르', id:717}, {n:'자시안', id:888}, {n:'자마젠타', id:889}, {n:'코라이돈', id:1007}
    ];

    async function startMatching() {
        const key = document.getElementById('apiKey').value;
        const city = document.getElementById('cityName').value.trim();
        if(!key) return alert("API 키를 입력해주세요.");
        if(!city) return alert("도시명을 입력해주세요.");

        document.getElementById('loading').style.display = 'block';
        document.getElementById('weatherInfo').style.display = 'none';
        document.getElementById('pokeGrid').innerHTML = '';

        try {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${key}&units=metric&lang=kr`;
            const res = await fetch(url);
            const data = await res.json();
            if(data.cod !== 200) throw new Error("도시를 찾을 수 없습니다.");
            showResult(data);
        } catch (e) {
            alert(e.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function showResult(data) {
        const info = document.getElementById('weatherInfo');
        const grid = document.getElementById('pokeGrid');
        
        info.style.display = 'block';
        document.getElementById('locName').innerText = `📍 ${data.name}`;
        document.getElementById('weatherText').innerText = `${data.weather[0].description} | ${Math.round(data.main.temp)}°C`;

        const weatherType = data.weather[0].main;
        let pool = pokemonPool[weatherType] || pokemonPool.Etc;
        let selected = [...pool].sort(() => 0.5 - Math.random()).slice(0, 5);
        
        // 에이스 선정 (일반/전설 형태)
        let ace = acePool[Math.floor(Math.random() * acePool.length)];

        selected.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png">
                    <div class="name">${p.n}</div>
                </div>`;
        });

        grid.innerHTML += `
            <div class="card ace-card">
                <div class="ace-tag">PARTY ACE</div>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${ace.id}.png">
                <div class="name">${ace.n}</div>
                <div class="form-info">최종 진화 형태</div>
            </div>`;
    }
</script>

</body>
</html>
